<form method="POST" action="/diagnose">
  <label>Do you have fever?</label>
  <select name="fever">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>Abdominal pain?</label>
  <select name="abdominal_pain">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>Bleeding or confusion?</label>
  <select name="bleeding">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <button type="submit">Diagnose</button>
</form>

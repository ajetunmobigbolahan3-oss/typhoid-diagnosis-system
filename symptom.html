{% extends "layout.html" %}
{% block content %}
<h2>Answer the following symptoms with Yes or No:</h2>
<form method="POST">
    {% for symptom in symptoms %}
        <p>{{ symptom }}:</p>
        <label><input type="radio" name="{{ symptom }}" value="Yes" required> Yes</label>
        <label><input type="radio" name="{{ symptom }}" value="No"> No</label>
        <hr>
    {% endfor %}
    <button type="submit">Submit</button>
</form>
{% endblock %}

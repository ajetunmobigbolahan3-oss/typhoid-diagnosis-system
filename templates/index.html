<!DOCTYPE html>
<html>
<head>
    <title>Typhoid Diagnosis System</title>
</head>
<body>
    <h2>Typhoid Fever Diagnosis Form</h2>
    <form action="/diagnose" method="post">
        <label>Fever (0-2):</label>
        <input type="number" name="fever" required><br><br>

        <label>Abdominal Pain (0-2):</label>
        <input type="number" name="abdominal_pain" required><br><br>

        <label>Vomiting (0-2):</label>
        <input type="number" name="vomiting" required><br><br>

        <button type="submit">Diagnose</button>
    </form>
</body>
</html>
